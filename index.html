<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#66c6ff">
<link rel="icon" type="image/png" href="assets/ui/egg.png">
<link rel="preload" as="image" href="assets/ui/egg.png">
<title>Мастер воровства яиц</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene"></canvas>

<!-- ============ Interface ============ -->
<div id="ui">

  <!-- Top left -->
  <div class="hud-top-left">
    <div class="hud-row">
      <button class="icon-btn" id="btnInventory" data-i18n-title="ui.inventory"><span data-ui-icon="bag"></span></button>
      <button class="icon-btn" id="btnIndex" data-i18n-title="ui.index"><span data-ui-icon="book"></span></button>
      <button class="icon-btn" id="btnLeaders" data-i18n-title="ui.leaders"><span data-ui-icon="trophy"></span></button>
    </div>
    <div class="toggle-wrap">
      <span class="lbl stroke" data-i18n="ui.slowMode">Slow mode:</span>
      <button class="switch" id="slowSwitch" type="button" role="switch" aria-checked="false" aria-label="Slow mode"><span class="dot"></span></button>
    </div>
    <div class="shop-cta stroke" id="btnShop">
      <span class="badge-new" data-i18n="ui.new">NEW!</span>
      <span data-i18n="ui.shop">Shop</span>
    </div>
  </div>

  <!-- Top right -->
  <div class="hud-top-right">
    <button class="icon-btn chest" id="btnSuper" data-i18n-title="ui.super"><span data-ui-icon="chest"></span></button>
    <button class="icon-btn gift" id="btnDaily" data-i18n-title="ui.daily"><span data-ui-icon="gift"></span><i class="hud-badge">!</i></button>
    <button class="icon-btn wheel" id="btnWheel" data-i18n-title="ui.wheel"><span data-ui-icon="prize-wheel"></span><i class="hud-badge" data-i18n="btn.free">Free</i></button>
    <button class="icon-btn gear" id="btnSettings" data-i18n-title="ui.settings"><span data-ui-icon="gear"></span></button>
  </div>

  <!-- Right column -->
  <div class="hud-side-right">
    <button class="side-btn" id="btnEggs" data-i18n-title="ui.eggs"><span class="hud-icon"><span data-ui-icon="egg"></span></span><span class="count" id="eggCount" style="display:none">0</span></button>
    <button class="side-btn" id="btnPets" data-i18n-title="ui.pets"><span class="hud-icon"><span data-ui-icon="paw"></span></span><span class="count" id="petCount" style="display:none">0</span></button>
    <button class="side-btn" id="btnTrails" data-i18n-title="ui.trails"><span data-ui-icon="rainbow"></span></button>
    <button class="side-btn boosts" id="btnBoosts" data-i18n-title="ui.boosts"><span class="hud-icon"><span data-ui-icon="lightning"></span></span></button>
  </div>

  <!-- Bottom left: money, gems and speed -->
  <div class="hud-bottom-left">
    <div class="stat small stroke"><span class="ic"><span data-ui-icon="shoe"></span></span><span id="statSpeed">20</span></div>
    <div class="money-row">
      <div class="stat stroke"><span id="statMoney">$400</span></div>
      <div class="gem-stat stroke" id="gemStat"><span class="gem-ic"><span data-ui-icon="gem"></span></span><span id="statGems">0</span></div>
    </div>
    <div class="chip stroke" id="incomeChip"><span><span data-ui-icon="banknotes"></span></span><span id="statIncome">0/sec</span></div>
  </div>

  <!-- Bottom right: active boosts -->
  <div class="hud-bottom-right" id="boostList"></div>

  <!-- Hint -->
  <div id="hint" class="stroke"></div>

  <!-- Alarm -->
  <div id="alarm" class="stroke" data-i18n="msg.run">RUN!</div>

  <!-- Toasts -->
  <div id="toasts"></div>

  <!-- Touch controls -->
  <div id="mobile">
    <div id="joystick"><div id="joyKnob"></div></div>
    <div class="mob-btn" id="btnAction" role="button" aria-label="Interact" data-icon-label="interact-hand"><span data-ui-icon="interact-hand"></span></div>
    <div class="mob-btn" id="btnAction2" role="button" aria-label="Sell all" data-icon-label="money-bag"><span data-ui-icon="money-bag"></span></div>
    <div class="mob-btn" id="btnJump" role="button" aria-label="Jump" data-icon-label="jump-arrow"><span data-ui-icon="jump-arrow"></span></div>
  </div>

  <!-- Modal panels -->
  <div id="modals"></div>
</div>

<!-- ============ Manual pause ============ -->
<div id="pause">
  <div class="stroke" data-i18n="pause.title">PAUSED</div>
  <button class="btn big" id="btnResume" data-i18n="pause.resume">Resume game</button>
  <button class="btn gold" id="btnHelpPause" data-i18n="ui.howToPlay">How to play</button>
</div>

<!-- ============ The platform has paused the game: no buttons, all input is blocked ============ -->
<div id="platformPause" role="alert" aria-live="assertive"><div class="stroke" data-i18n="pause.platform">Paused</div></div>

<!-- ============ Waiting for an ad ============ -->
<div id="adWait"><div class="stroke" data-i18n="ad.loading">Ad is loading...</div></div>

<!-- ============ Loading ============ -->
<div id="loading">
  <div class="egg-anim"><span data-ui-icon="egg"></span></div>
  <div class="logo stroke" id="loadTitle">Мастер воровства яиц</div>
  <div class="bar" id="loadBar"><i style="width:5%"></i></div>
  <div class="tip stroke" id="loadTip" style="font-family:Arial,sans-serif">Загрузка...</div>
  <button class="btn big" id="btnRetry" style="display:none" data-i18n="btn.retry">Retry</button>
</div>

<script src="https://games.pikabu.ru/sdk/sdk.js"></script>
    <script src="./pikabu-bridge.js"></script>
<script src="js/platform.js"></script>
<script src="js/lib/three.min.js"></script>
<script src="js/lib/BufferGeometryUtils.js"></script>
<script src="js/lib/GLTFLoader.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/audio.js"></script>
<script src="js/pets.js"></script>
<script src="js/economy.js"></script>
<script src="js/assets.js"></script>
<script src="js/models.js"></script>
<script src="js/data/outfits.js"></script>
<script src="js/data/cosmetic-models.js"></script>
<script src="js/fx.js"></script>
<script src="js/batch.js"></script>
<script src="js/terrain.js"></script>
<script src="js/world.js"></script>
<script src="js/guards.js"></script>
<script src="js/player.js"></script>
<script src="js/bots.js"></script>
<script src="js/ads.js"></script>
<script src="js/shop.js"></script>
<script src="js/daily.js"></script>
<script src="js/wheel.js"></script>
<script src="js/super.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
